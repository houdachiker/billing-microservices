spring.application.name=service-facturation
server.port=8083

# Base de donnees H2 (en memoire) - console : http://localhost:8083/h2-console
spring.datasource.url=jdbc:h2:mem:facturationdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# A AJOUTER PLUS TARD (Eureka / Config Server) :
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# TVA appliquee aux factures
facturation.tva-rate=0.20
